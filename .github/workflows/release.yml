name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Publish GitHub Release v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "v1.1.0: 纯本地离线 BM25 检索、SSE 流式传输与通用大模型兼容演进"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
